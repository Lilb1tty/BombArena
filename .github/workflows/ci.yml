name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: mysql://pixel_arena:pixel_arena@127.0.0.1:3306/pixel_arena
      REDIS_URL: redis://127.0.0.1:6379
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: pixel_arena
          MYSQL_USER: pixel_arena
          MYSQL_PASSWORD: pixel_arena
          MYSQL_ROOT_PASSWORD: local_root_password
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -u root -plocal_root_password"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npm run db:migrate
      - run: npm run format
      - run: npm run typecheck
      - run: npm test
      - run: docker build --tag pixel-arena .
