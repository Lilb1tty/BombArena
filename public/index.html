<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Pixel Arena</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: system-ui, sans-serif;
      }
      body {
        display: grid;
        min-height: 100vh;
        margin: 0;
        place-items: center;
        background: #111827;
      }
      main {
        max-width: 34rem;
        padding: 2.5rem;
        text-align: center;
      }
      h1 {
        color: #fbbf24;
        font-size: clamp(2.5rem, 10vw, 5rem);
        margin: 0;
      }
      p {
        color: #d1d5db;
        font-size: 1.15rem;
        line-height: 1.6;
      }
      code {
        color: #67e8f9;
      }
      input,
      button {
        font: inherit;
        margin: 0.25rem;
        padding: 0.5rem;
      }
      #state {
        max-height: 18rem;
        overflow: auto;
        text-align: left;
        white-space: pre-wrap;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Pixel Arena</h1>
      <p>Register or sign in, then create or join a Room.</p>
      <form id="account-form">
        <input
          id="username"
          required
          minlength="3"
          placeholder="Account name"
        />
        <input
          id="password"
          required
          minlength="8"
          type="password"
          placeholder="Password"
        />
        <button name="action" value="register">Register</button>
        <button name="action" value="login">Sign in</button>
      </form>
      <p id="account">Not signed in</p>
      <p>
        <button id="create" type="button">Create Room</button>
        <input id="room-code" maxlength="6" placeholder="Room Code" />
        <button id="join" type="button">Join Room</button>
        <button id="ready" type="button">Ready</button>
      </p>
      <p id="room">No Room selected</p>
      <pre id="state">Service status: GET /health</pre>
    </main>
    <script>
      const state = document.querySelector("#state");
      const roomText = document.querySelector("#room");
      const accountText = document.querySelector("#account");
      const roomCode = document.querySelector("#room-code");
      const usernameInput = document.querySelector("#username");
      const passwordInput = document.querySelector("#password");
      let room;
      let socket;

      const show = (value) =>
        (state.textContent = JSON.stringify(value, null, 2));
      const request = async (path, options = {}) => {
        const response = await fetch(path, {
          ...options,
          credentials: "same-origin",
        });
        const body = response.status === 204 ? null : await response.json();
        if (!response.ok)
          throw new Error(body.error || `HTTP ${response.status}`);
        return body;
      };
      const setRoom = (next) => {
        room = next;
        roomCode.value = room.code;
        roomText.textContent = `${room.code}: ${room.phase} (${room.players.length} Players)`;
        show(room);
        if (room.phase === "started") connect();
      };
      const connect = () => {
        if (!room || socket) return;
        socket = new WebSocket(
          `${location.origin.replace("http", "ws")}/realtime?roomCode=${room.code}`,
        );
        socket.onmessage = ({ data }) => show(JSON.parse(data));
        socket.onclose = () => (socket = undefined);
      };

      document
        .querySelector("#account-form")
        .addEventListener("submit", async (event) => {
          event.preventDefault();
          const action = event.submitter.value;
          try {
            const account = await request(`/auth/${action}`, {
              method: "POST",
              headers: { "content-type": "application/json" },
              body: JSON.stringify({
                username: usernameInput.value,
                password: passwordInput.value,
              }),
            });
            accountText.textContent = `Signed in as ${account.account.username}`;
            show(account);
          } catch (error) {
            show({ error: error.message });
          }
        });
      document.querySelector("#create").onclick = async () => {
        try {
          setRoom((await request("/rooms", { method: "POST" })).room);
        } catch (error) {
          show({ error: error.message });
        }
      };
      document.querySelector("#join").onclick = async () => {
        try {
          setRoom(
            (await request(`/rooms/${roomCode.value}/join`, { method: "POST" }))
              .room,
          );
        } catch (error) {
          show({ error: error.message });
        }
      };
      document.querySelector("#ready").onclick = async () => {
        if (!room) return;
        try {
          setRoom(
            (await request(`/rooms/${room.code}/ready`, { method: "POST" }))
              .room,
          );
        } catch (error) {
          show({ error: error.message });
        }
      };
    </script>
  </body>
</html>
